name: Linux build

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Clear conan home
      run: rm -rf ~/.conan2/*

    - name: Cache conan dependencies
      id: cache-conan-dependencies
      uses: actions/cache@v4
      with:
        path: ~/.conan2
        key: conan-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ steps.system-info.outputs.release }}-${{ hashFiles('conanfile.txt') }}

    - name: Configure conan
      run: |
        chmod +x ./scripts/conan_build.sh
        ./scripts/conan_build.sh
      shell: bash

    - name: Configure CMake & Build
      run: |
        chmod +x ./scripts/build.sh
        ./scripts/build.sh
      shell: bash

